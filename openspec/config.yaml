schema: spec-driven

context: |
  This repo is the canonical local codebase for the broader Endolaserless analysis workspace, not just the current NPI manuscript pipeline.
  The project is script-first and centered on standalone R scripts under `scripts/`, not an R package or app.
  `scripts/endolaserless_analysis-2.R` is the active NPI pipeline, `scripts/count_prn_injections.R` consumes its processed workbook outputs, and `scripts/neovascularization_project.R` is a scaffold-only helper for the unstarted neovascularization track.
  Path resolution is centralized in `scripts/project_paths.R`.
  That resolver supports `ENDOLASERLESS_CODE_ROOT`, `ENDOLASERLESS_RUNTIME_ROOT`, and `ENDOLASERLESS_CLOUD_ROOT` overrides and should model the umbrella repo plus explicit `npi_project` and `neovascularization_project` roots.
  Shared raw study inputs resolve under the cloud `data/raw` root, while regenerated processed workbooks and outputs resolve under runtime `processed_data/<subproject>` and `output/<subproject>`.
  Cloud subproject folders are archive or published-output homes, not canonical code roots.
  `docs/*.png` are publication-display mirrors; plan changes against the underlying runtime outputs rather than treating those PNGs as canonical sources.
  Core domain terms remain q8 versus q16 schedules, week 4 or week 16 baselines, NPI/NPA, cumulative injections, and PRN rescue injections.
  There is no lockfile, project manifest, or automated test suite in-repo, so changes should plan explicit validation around script reruns, path checks, and artifact comparisons.

rules:
  proposal:
    - Name the exact scripts, external input files, and output workbooks or mirrored figures affected by the change.
    - Call out any change to path resolution, input file expectations, or the dependency from `endolaserless_analysis-2.R` into `count_prn_injections.R`.
    - Note compatibility risk for previously generated processed workbooks, Prism-facing exports, subproject archive materials, and `docs/` figure mirrors.
  specs:
    - Use current repo terminology from the scripts and README: q8/q16 schedules, week4 or week16 baselines, NPI/NPA, cumulative injections, and PRN injections.
    - Make behavior statements concrete about which artifacts are read from shared cloud roots versus written to runtime or subproject archive roots.
    - Prefer the path behavior defined in `scripts/project_paths.R` over README summaries when they differ.
  design:
    - Reuse the existing script-first workflow and helper functions before proposing new abstractions or package structure.
    - Describe data flow across shared raw Excel inputs, subproject processed workbooks, derived injection summaries, and mirrored publication assets.
    - Include failure modes for missing external files, path drift across local/runtime/cloud roots, and downstream scripts consuming stale intermediate outputs.
  tasks:
    - Break work into small, script-scoped steps and include docs or config updates when workflow assumptions, subproject boundaries, or artifact locations change.
    - Include validation steps that check both direct script outputs and downstream artifacts that consume them.
    - If a change modifies path resolution or root defaults, include updates for both `scripts/project_paths.R` and any README or config text that describes artifact locations.
